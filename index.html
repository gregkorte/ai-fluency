<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Fluency Craft Tree</title>
<style>
  :root {
    --bg: #0a0b10; --panel: #14161f; --line: #5c5138; --line-bright: #d4af6a;
    --carry: #a85a3a; --text: #e8e6df; --text-dim: #8f8c7f;
    --c1: #2dd4bf; --c1-fill: #10231f;
    --c2: #60a5fa; --c2-fill: #0f1e2f;
    --c3: #a78bfa; --c3-fill: #1a1730;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: radial-gradient(ellipse at 50% 20%, #16151f 0%, #0a0b10 70%); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  header { flex: 0 0 auto; padding: 16px 32px; border-bottom: 1px solid #2a2a30; }
  h1 { font-size: 20px; font-weight: 500; margin: 0; }
  .sub { color: var(--text-dim); font-size: 13px; margin: 0 0 8px; }
  .note { color: var(--text-dim); font-size: 12px; margin: 0; font-style: italic; }
  .legend { flex: 0 0 auto; display: flex; gap: 20px; padding: 12px 32px; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid #2a2a30; align-items: center; flex-wrap: wrap; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
  .dot.star { width: 18px; height: 18px; border: 2px solid var(--line-bright); background: transparent; }
  .swatch { width: 24px; height: 2px; display: inline-block; margin-right: 6px; vertical-align: middle; }
  .canvas-wrap { flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 16px 0; display: flex; justify-content: center; align-items: center; }
  svg { display: block; }
  .node-circle { cursor: pointer; transition: filter 0.15s; }
  .node-circle:hover { filter: brightness(1.4); }
  .node-label { font-size: 11px; font-weight: 500; fill: var(--text); pointer-events: none; text-anchor: middle; }
  .panel-label { font-size: 15px; font-weight: 500; fill: var(--text-dim); text-anchor: middle; }
  .bridge-mark { fill: var(--line-bright); }
  .edge { stroke: var(--line); fill: none; transition: stroke 0.2s, stroke-width 0.2s; }
  .edge.carry { stroke: var(--carry); stroke-dasharray: 5 5; }
  .edge.lit { stroke: var(--line-bright); stroke-dasharray: none; }
  .desc-panel { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid #2a2a30; padding: 16px 32px; min-height: 64px; }
  .desc-panel .name { font-size: 15px; font-weight: 500; margin: 0 0 4px; }
  .desc-panel .body { font-size: 13px; color: var(--text-dim); margin: 0; max-width: 640px; line-height: 1.5; }
  .placeholder { color: var(--text-dim); font-size: 13px; font-style: italic; }
  .tooltip {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--line-bright);
    border-radius: 8px;
    padding: 12px 14px;
    max-width: 280px;
    pointer-events: none;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .tooltip .name { font-size: 14px; font-weight: 500; margin: 0 0 4px; color: var(--text); }
  .tooltip .body { font-size: 12px; color: var(--text-dim); margin: 0; line-height: 1.45; }
  .tooltip .bridge { color: var(--line-bright); font-size: 11px; display: block; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>AI Fluency Craft Tree</h1>
</header>

<div class="legend">
  <span><span class="dot" style="background:var(--c1)"></span>Class One</span>
  <span><span class="dot" style="background:var(--c2)"></span>Class Two</span>
  <span><span class="dot" style="background:var(--c3)"></span>Class Three</span>
  <span><span class="dot star"></span>Star - convergence point</span>
  <span><svg width="12" height="12"><circle cx="6" cy="6" r="4" fill="var(--line-bright)"/></svg> Cross-book dependency</span>
</div>

<div class="canvas-wrap">
  <svg id="tree-svg"></svg>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const ROW_H = 105;
const TOP_Y = 80;
const STARS = new Set(["review","comparison","revision","discrepancy","viability","specification","parsing","adherence","coldstart","orchestration"]);

const BRIDGE_NOTE = {
  grounding: "feeds Recognition in Class Two",
  revision: "feeds Continuity in Class Two",
  comparison: "feeds Discrepancy in Class Two",
  plainspeech: "feeds Candidacy in Class Two",
  recognition: "fed by Grounding in Class One",
  continuity: "fed by Revision in Class One; feeds Specification in Class Three",
  discrepancy: "fed by Comparison in Class One",
  candidacy: "fed by Plain Speech in Class One; feeds Viability in Class Three",
  vetting: "feeds Shift in Class Three",
  configuration: "feeds Specification in Class Three",
  workflow: "feeds Parsing in Class Three",
  interception: "feeds Adherence in Class Three",
  adjustment: "feeds Footprint in Class Three",
  shift: "fed by Vetting in Class Two",
  viability: "fed by Candidacy in Class Two",
  specification: "fed by Configuration and Continuity in Class Two",
  parsing: "fed by Workflow in Class Two",
  adherence: "fed by Interception in Class Two",
  footprint: "fed by Adjustment in Class Two",
};

// ---------- Class One: manual lane layout ----------
const c1 = [
  { id: "modelsense",   name: "Model Sense",  cls: 1, x: 450, tier: 0,  desc: "Building an accurate picture of how an LLM actually generates an answer, so you're not relying on guesswork or hype." },
  { id: "precision",    name: "Precision",    cls: 1, x: 450, tier: 1,  desc: "Writing a prompt that spells out the outcome you want, the context the model needs, and the format the answer should take - instead of a vague ask." },
  { id: "profile",      name: "Profile",      cls: 1, x: 190, tier: 1,  desc: "Drafting a first version of your \"AI profile\" - a short written description of your work and preferences that you can hand to any AI tool so it has context about you." },
  { id: "grounding",    name: "Grounding",    cls: 1, x: 710, tier: 1,  desc: "Telling the difference between a tool answering from a specific set of documents you gave it, versus one answering from its own general training." },
  { id: "iteration",    name: "Iteration",    cls: 1, x: 340, tier: 2,  desc: "Rewriting a prompt to fix what was missing or wrong in the model's first attempt, instead of starting over from scratch." },
  { id: "blueprinting", name: "Blueprinting", cls: 1, x: 400, tier: 2,  desc: "Outlining a document's sections and structure before asking the model to write it." },
  { id: "plainspeech",  name: "Plain Speech", cls: 1, x: 460, tier: 2,  desc: "Turning a table or spreadsheet of data into a summary a non-technical reader could actually follow." },
  { id: "drafting",     name: "Drafting",     cls: 1, x: 520, tier: 2,  desc: "Getting a usable first draft out of a one-line instruction about what you want the output to accomplish." },
  { id: "composition",  name: "Composition",  cls: 1, x: 400, tier: 3,  desc: "Writing a full document that actually follows the structure you laid out in Blueprinting." },
  { id: "triage",       name: "Triage",       cls: 1, x: 460, tier: 3,  desc: "Deciding which numbers in an AI-written document are important enough to verify, instead of checking everything (too slow) or nothing (too risky)." },
  { id: "digest",       name: "Digest",       cls: 1, x: 520, tier: 3,  desc: "Condensing a long email or chat thread into a short summary of what was actually decided." },
  { id: "accuracy",     name: "Accuracy",     cls: 1, x: 340, tier: 4,  desc: "Comparing an AI-written document against its source material to catch anything it added, dropped, or changed." },
  { id: "audit",        name: "Audit",        cls: 1, x: 450, tier: 4,  desc: "Tracing one specific number in an AI output back to where it came from, to confirm it's correct." },
  { id: "proofing",     name: "Proofing",     cls: 1, x: 560, tier: 4,  desc: "Giving a piece of writing one last check for factual errors or a wrong tone before it goes out." },
  { id: "calibration",  name: "Calibration",  cls: 1, x: 450, tier: 5,  desc: "Learning to trust an AI tool exactly as much as its track record has earned - not automatically, and not never." },
  { id: "diagnosis",    name: "Diagnosis",    cls: 1, x: 450, tier: 6,  desc: "Telling a \"hallucination\" (an AI making something up) apart from an ordinary mistake a person could just as easily make." },
  { id: "review",       name: "Review",       cls: 1, x: 450, tier: 7,  desc: "Doing a deliberate second read of AI output aimed specifically at catching errors - the checking habits from Triage, Digest, and Composition, now combined into one routine." },
  { id: "detection",    name: "Detection",    cls: 1, x: 450, tier: 8,  desc: "Spotting an error that's been deliberately hidden inside confident, well-written AI text." },
  { id: "context",      name: "Context",      cls: 1, x: 190, tier: 9,  desc: "Feeding your AI profile into a brand-new conversation so the tool has context about you right from the start." },
  { id: "comparison",   name: "Comparison",   cls: 1, x: 710, tier: 9,  desc: "Comparing how you'd verify an answer from a grounded tool (working off your documents) versus a general chat tool (working from memory alone)." },
  { id: "blindspot",    name: "Blind Spot",   cls: 1, x: 580, tier: 10, desc: "Identifying something about your own work that felt too obvious to mention - and is therefore missing from your AI profile." },
  { id: "revision",     name: "Revision",     cls: 1, x: 450, tier: 11, desc: "Rewriting your AI profile with real changes, based on what actually didn't work the first time you used it." },
  { id: "fluency",      name: "Fluency",      cls: 1, x: 450, tier: 12, desc: "Combining every skill from the course into one self-directed workflow, applied to material you've never seen before." },
];
const c1Edges = [
  ["modelsense","precision"],["modelsense","profile"],["modelsense","grounding"],
  ["precision","iteration"],["precision","blueprinting"],["precision","plainspeech"],["precision","drafting"],
  ["blueprinting","composition"],["plainspeech","triage"],["drafting","digest"],
  ["composition","accuracy"],["triage","audit"],["digest","proofing"],
  ["audit","calibration"],["calibration","diagnosis"],
  ["diagnosis","review"],["proofing","review"],["accuracy","review"],
  ["review","detection"],["detection","comparison"],["grounding","comparison"],
  ["profile","context"],["context","revision"],["comparison","blindspot"],
  ["blindspot","revision"],["revision","fluency"],
];

// ---------- Class Two: rocket layout (precomputed from local-tier engine) ----------
const c2 = [
  { id: "recognition",  name: "Recognition",  cls: 2, x: 1255,   tier: 0,  desc: "Telling a tool that's actively connected to a live source apart from one you've simply pasted text into." },
  { id: "candidacy",    name: "Candidacy",    cls: 2, x: 1400,   tier: 0,  desc: "Spotting which of your recurring tasks are repetitive enough to be worth saving as a reusable AI \"Skill.\"" },
  { id: "continuity",   name: "Continuity",   cls: 2, x: 1545,   tier: 0,  desc: "Bringing your AI profile from Class One into a tool that's now connected to live sources, not just a chat window." },
  { id: "vetting",      name: "Vetting",      cls: 2, x: 1255,   tier: 1,  desc: "Deciding which data sources are safe and appropriate to connect an AI tool to - and which ones aren't." },
  { id: "configuration",name: "Configuration",cls: 2, x: 1400,   tier: 1,  desc: "Setting up a reusable, saved set of instructions (\"a Skill\") that handles one of your recurring tasks automatically." },
  { id: "currency",     name: "Currency",     cls: 2, x: 1545,   tier: 1,  desc: "Recognizing when a connected source has more up-to-date information than the model's own training data." },
  { id: "ownership",    name: "Ownership",    cls: 2, x: 1327.5, tier: 2,  desc: "Deciding for yourself how much access a connected tool should have, instead of just accepting its default settings." },
  { id: "retrieval",    name: "Retrieval",    cls: 2, x: 1472.5, tier: 2,  desc: "Pulling exactly the information you need from a connected source, without letting the tool grab more than necessary." },
  { id: "boundaries",   name: "Boundaries",   cls: 2, x: 1327.5, tier: 3,  desc: "Limiting a request to one specific section of a source, instead of handing over an entire document." },
  { id: "synthesis",    name: "Synthesis",    cls: 2, x: 1472.5, tier: 3,  desc: "Combining information pulled from more than one connected source into a single answer." },
  { id: "adjustment",   name: "Adjustment",   cls: 2, x: 1327.5, tier: 4,  desc: "Proposing a narrower or different level of access once you've spotted a problem with the current setup." },
  { id: "discrepancy",  name: "Discrepancy",  cls: 2, x: 1472.5, tier: 4,  desc: "Catching a factual conflict between two sources, instead of letting the tool silently pick one and move on." },
  { id: "provenance",   name: "Provenance",   cls: 2, x: 1400,   tier: 5,  desc: "Tracing any claim in an AI output back to the exact source it came from." },
  { id: "signoff",      name: "Sign-off",     cls: 2, x: 1400,   tier: 6,  desc: "Running a fixed three-question check before approving any action where the AI tool actually sends, writes, or changes something (not just answers a question)." },
  { id: "targeting",    name: "Targeting",    cls: 2, x: 1400,   tier: 7,  desc: "Catching a wrong recipient or wrong target before an AI-initiated action actually goes out." },
  { id: "threshold",    name: "Threshold",    cls: 2, x: 1400,   tier: 8,  desc: "Understanding why reviewing an action that changes something is higher-stakes than reviewing a plain chat answer." },
  { id: "overreach",    name: "Overreach",    cls: 2, x: 1400,   tier: 9,  desc: "Recognizing \"scope creep\" - the AI doing more than it was asked - as its own kind of error, distinct from making something up." },
  { id: "interception", name: "Interception", cls: 2, x: 1400,   tier: 10, desc: "Catching one planted, out-of-scope detail hidden inside output that's otherwise accurate." },
  { id: "declaration",  name: "Declaration",  cls: 2, x: 1400,   tier: 11, desc: "Writing down your access decision before you ever open the tool - a decision, not an afterthought." },
  { id: "workflow",     name: "Workflow",     cls: 2, x: 1400,   tier: 12, desc: "Combining scoped reading, multi-source synthesis, and write-action review into one complete connected workflow." },
];
const c2Edges = [
  ["recognition","vetting"],["vetting","ownership"],["ownership","boundaries"],["boundaries","adjustment"],
  ["candidacy","configuration"],
  ["continuity","currency"],["currency","retrieval"],["retrieval","synthesis"],["synthesis","discrepancy"],
  ["adjustment","discrepancy"],["discrepancy","provenance"],["provenance","signoff"],["signoff","targeting"],
  ["targeting","threshold"],["threshold","overreach"],["overreach","interception"],["interception","declaration"],
  ["declaration","workflow"],
];

// ---------- Class Three: center spine + two side branches ----------
const XSHIFT3 = 1800;
const c3 = [
  { id: "specification", name: "Specification", cls: 3, x: 450+XSHIFT3, tier: 0,  desc: "Writing a complete brief for an AI agent: the outcome you want, the constraints it must respect, the conditions that should stop it, and checkpoints where you'll review its work." },
  { id: "shift",         name: "Shift",         cls: 3, x: 190+XSHIFT3, tier: 0,  desc: "Explaining what makes an AI agent fundamentally different from the single-prompt, single-review tools used in Classes One and Two." },
  { id: "footprint",     name: "Footprint",     cls: 3, x: 710+XSHIFT3, tier: 0,  desc: "Understanding exactly what an AI agent can see, reach, and act on once it's running without you watching." },
  { id: "checkpoint",    name: "Checkpoint",    cls: 3, x: 450+XSHIFT3, tier: 1,  desc: "Telling a checkpoint (a planned pause for your review) apart from a stop condition (a rule that halts the agent automatically)." },
  { id: "viability",     name: "Viability",     cls: 3, x: 190+XSHIFT3, tier: 1,  desc: "Deciding whether a real task is actually well-suited to hand off to an agent to run on its own." },
  { id: "clarity",       name: "Clarity",       cls: 3, x: 450+XSHIFT3, tier: 2,  desc: "Checking whether a brief is specific enough that someone else could predict exactly how the agent will behave." },
  { id: "redline",       name: "Redline",       cls: 3, x: 190+XSHIFT3, tier: 2,  desc: "Identifying a task that should never be handed off to an agent - and being able to say why." },
  { id: "parsing",       name: "Parsing",       cls: 3, x: 450+XSHIFT3, tier: 3,  desc: "Breaking a long agent run into separate steps you can evaluate one at a time." },
  { id: "adherence",     name: "Adherence",     cls: 3, x: 450+XSHIFT3, tier: 4,  desc: "Judging whether a given step followed the brief, or whether the agent substituted its own judgment instead." },
  { id: "approval",      name: "Approval",      cls: 3, x: 600+XSHIFT3, tier: 5,  desc: "Deciding whether to let an agent's run continue at a scheduled mid-point checkpoint." },
  { id: "divergence",    name: "Divergence",    cls: 3, x: 450+XSHIFT3, tier: 5,  desc: "Telling ongoing \"drift\" - the agent gradually veering off course - apart from one isolated wrong output." },
  { id: "pinpoint",      name: "Pinpoint",      cls: 3, x: 450+XSHIFT3, tier: 6,  desc: "Locating the exact step where a drifting run first went off track." },
  { id: "placement",     name: "Placement",     cls: 3, x: 450+XSHIFT3, tier: 7,  desc: "Proposing where a checkpoint should have been placed to catch the drift before it went this far." },
  { id: "trigger",       name: "Trigger",       cls: 3, x: 450+XSHIFT3, tier: 8,  desc: "Identifying a stop condition that was defined but should have fired - and didn't." },
  { id: "verdict",       name: "Verdict",       cls: 3, x: 450+XSHIFT3, tier: 9,  desc: "Deciding, and justifying, whether a drifting run should be stopped and escalated or corrected and allowed to continue." },
  { id: "validation",    name: "Validation",    cls: 3, x: 450+XSHIFT3, tier: 10, desc: "Recognizing a run the agent correctly stopped itself as a success story, not a failure." },
  { id: "coldstart",     name: "Cold Start",    cls: 3, x: 190+XSHIFT3, tier: 10, desc: "Writing a complete brief from nothing but a bare task description - no template to fill in." },
  { id: "breach",        name: "Breach",        cls: 3, x: 710+XSHIFT3, tier: 10, desc: "Recognizing the warning signs that an agent has gone beyond the access it was actually granted." },
  { id: "orchestration", name: "Orchestration", cls: 3, x: 450+XSHIFT3, tier: 11, desc: "The series' capstone skill: combining automation, verification, and access-governance into one complete, self-directed practice." },
];
const c3Edges = [
  ["specification","checkpoint"],["checkpoint","clarity"],["clarity","parsing"],["parsing","adherence"],
  ["adherence","approval"],["adherence","divergence"],["divergence","pinpoint"],["pinpoint","placement"],
  ["placement","trigger"],["trigger","verdict"],["verdict","validation"],["validation","orchestration"],
  ["shift","viability"],["viability","redline"],["redline","coldstart"],["clarity","coldstart"],["coldstart","orchestration"],
  ["footprint","breach"],["breach","orchestration"],
];

// ---------- cross-book edges: only used to mark nodes, never drawn ----------
const bridgeEdges = [
  ["grounding","recognition"],["revision","continuity"],["comparison","discrepancy"],["plainspeech","candidacy"],
  ["vetting","shift"],["candidacy","viability"],["configuration","specification"],["continuity","specification"],
  ["workflow","parsing"],["interception","adherence"],["adjustment","footprint"],
];
const HAS_BRIDGE = new Set(bridgeEdges.flat());

const raw = [...c1, ...c2, ...c3];
const byId = Object.fromEntries(raw.map(n => [n.id, n]));
raw.forEach(n => { n.star = STARS.has(n.id); });

const sharedMaxTier = 12;
raw.forEach(n => { n.y = TOP_Y + (sharedMaxTier - n.tier) * ROW_H; });

const allLocalEdges = [
  ...c1Edges.map(e => [...e, 1]),
  ...c2Edges.map(e => [...e, 2]),
  ...c3Edges.map(e => [...e, 3]),
];

const minX = Math.min(...raw.map(n => n.x)) - 90;
const maxXv = Math.max(...raw.map(n => n.x)) + 90;
const maxY = TOP_Y + sharedMaxTier * ROW_H + 90;
const svgW = maxXv - minX;

const svg = document.getElementById("tree-svg");
svg.setAttribute("viewBox", `${minX} 0 ${svgW} ${maxY}`);

const canvasWrap = document.querySelector(".canvas-wrap");
function sizeSvg() {
  // Fit the whole tree inside the available area - no scrolling needed.
  const availW = canvasWrap.clientWidth || window.innerWidth;
  const availH = canvasWrap.clientHeight || window.innerHeight;
  const scale = Math.min(availW / svgW, availH / maxY);
  const renderW = svgW * scale;
  const renderH = maxY * scale;
  svg.setAttribute("width", renderW);
  svg.setAttribute("height", renderH);
}
sizeSvg();
window.addEventListener("resize", sizeSvg);

const svgns = "http://www.w3.org/2000/svg";
function el(tag, attrs) { const e = document.createElementNS(svgns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

[1,2,3].forEach(c => {
  const label = { 1: "Class One", 2: "Class Two", 3: "Class Three" }[c];
  const cx = { 1: 450, 2: 1400, 3: 450 + 1800 }[c];
  const t = el("text", { x: cx, y: maxY - 20, class: "panel-label" });
  t.textContent = label;
  svg.appendChild(t);
});

const edgeEls = {};
allLocalEdges.forEach(([fromId, toId, cls]) => {
  const from = byId[fromId], to = byId[toId];
  const tierGap = Math.abs(to.tier - from.tier);
  let path;
  if (tierGap > 1) {
    const midY = (from.y + to.y) / 2;
    const d = `M ${from.x} ${from.y} C ${from.x} ${midY}, ${to.x} ${midY}, ${to.x} ${to.y}`;
    path = el("path", { d, class: "edge carry" });
  } else {
    const mx = (from.x + to.x) / 2, my = (from.y + to.y) / 2;
    const bendAmt = Math.abs(from.x - to.x) < 2 ? 0 : 16;
    const d = `M ${from.x} ${from.y} Q ${mx} ${my - bendAmt}, ${to.x} ${to.y}`;
    path = el("path", { d, class: "edge" });
  }
  svg.appendChild(path);
  (edgeEls[fromId] = edgeEls[fromId] || []).push(path);
  (edgeEls[toId] = edgeEls[toId] || []).push(path);
});

const tooltip = document.getElementById("tooltip");
const clsColors = { 1: { s: "var(--c1)", f: "var(--c1-fill)" }, 2: { s: "var(--c2)", f: "var(--c2-fill)" }, 3: { s: "var(--c3)", f: "var(--c3-fill)" } };
const clsName = { 1: "Class One", 2: "Class Two", 3: "Class Three" };
let pinnedId = null;

function positionTooltip(rect) {
  const margin = 10;
  let left = rect.right + margin;
  let top = rect.top;
  const tw = 280, th = tooltip.offsetHeight || 90;
  if (left + tw > window.innerWidth) left = rect.left - tw - margin;
  if (left < 0) left = Math.max(4, rect.left);
  if (top + th > window.innerHeight) top = window.innerHeight - th - margin;
  if (top < 0) top = margin;
  tooltip.style.left = left + "px";
  tooltip.style.top = top + "px";
}

function fillTooltip(n) {
  const bridge = BRIDGE_NOTE[n.id] ? `<span class="bridge">${BRIDGE_NOTE[n.id]}</span>` : "";
  tooltip.innerHTML = `<p class="name">${n.name} <span style="color:var(--text-dim);font-weight:400">(${clsName[n.cls]})</span></p><p class="body">${n.desc}</p>${bridge}`;
}

raw.forEach(n => {
  const g = el("g", {});
  const colors = clsColors[n.cls];
  const r = n.star ? 27 : 16;
  const circle = el("circle", { cx: n.x, cy: n.y, r, class: "node-circle", fill: colors.f, stroke: colors.s, "stroke-width": n.star ? 2.5 : 1.5 });
  g.appendChild(circle);
  if (n.star) g.appendChild(el("circle", { cx: n.x, cy: n.y, r: r + 5, fill: "none", stroke: colors.s, "stroke-width": 1, opacity: 0.4 }));
  if (HAS_BRIDGE.has(n.id)) g.appendChild(el("circle", { cx: n.x + r - 2, cy: n.y - r + 2, r: 4, class: "bridge-mark" }));
  svg.appendChild(g);
  const label = el("text", { x: n.x, y: n.y + r + 13, class: "node-label" });
  label.textContent = n.name;
  svg.appendChild(label);

  function showTooltip() {
    fillTooltip(n);
    const rect = circle.getBoundingClientRect();
    positionTooltip(rect);
    tooltip.style.opacity = 1;
  }
  function hideTooltip() {
    if (pinnedId === n.id) return;
    tooltip.style.opacity = 0;
  }
  function lightEdges(on) { (edgeEls[n.id] || []).forEach(p => p.classList.toggle("lit", on)); }

  g.style.cursor = "pointer"; label.style.cursor = "pointer";
  [g, label].forEach(elm => {
    elm.addEventListener("mouseenter", () => { showTooltip(); lightEdges(true); });
    elm.addEventListener("mouseleave", () => { hideTooltip(); lightEdges(false); });
    elm.addEventListener("click", (e) => {
      e.stopPropagation();
      pinnedId = (pinnedId === n.id) ? null : n.id;
      if (pinnedId === n.id) { showTooltip(); } else { tooltip.style.opacity = 0; }
    });
  });
});

document.body.addEventListener("click", () => { pinnedId = null; tooltip.style.opacity = 0; });

</script>

</body>
</html>
